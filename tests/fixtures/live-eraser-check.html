<!doctype html><html lang="en"><meta charset="utf-8"><title>Live eraser canvas check</title><style>body{font:16px system-ui;margin:24px;background:#f4f5fa;color:#292b46}button{padding:12px 18px}canvas{display:block;background:white;width:420px;max-width:100%;margin-top:20px;border:1px solid #ddd}p{max-width:700px;line-height:1.5}</style><h1>Live eraser canvas check</h1><p>This synthetic check uses the real browser Canvas API and the preview module. It inspects pixels while the gesture is still active, before completion or persistence.</p><button id="run">Check live erasing</button><p id="result" role="status">Not run</p><canvas id="sheet" width="840" height="500"></canvas><script src="../../eraser-preview.js?v=49"></script><script>
const canvas=document.getElementById('sheet'),ctx=canvas.getContext('2d');
function background(target){target.fillStyle='#fff';target.fillRect(0,0,840,500);target.strokeStyle='#e1e7f3';target.lineWidth=1;for(let y=122;y<500;y+=36){target.beginPath();target.moveTo(0,y+.5);target.lineTo(840,y+.5);target.stroke();}}
function source(){background(ctx);ctx.strokeStyle='#2b2d4c';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(100,300);ctx.lineTo(700,300);ctx.stroke();}
source();document.getElementById('run').onclick=()=>{try{source();const item={id:'ink',type:'stroke',points:[[100,300],[700,300]]},box={x:94,y:294,w:612,h:12},engine=WindsEraserPreview.create({makeCanvas:()=>document.createElement('canvas'),bounds:()=>box,visualBounds:()=>box,localPoint:(item,p)=>p}),key={scope:{account:'synthetic',book:'b',page:'p'},revision:0,width:840,height:500,inkOnly:false};
if(!engine.prepare(key,[item],background))throw Error('Preview allocation failed');const gesture={radius:20};engine.begin(gesture,key);engine.add(gesture,{x:400,y:285});engine.add(gesture,{x:400,y:315});engine.paint(ctx,key.scope);
const pixel=(x,y)=>Array.from(ctx.getImageData(x,y,1,1).data),white=p=>p.slice(0,3).every(n=>n===255),dark=p=>p.slice(0,3).every(n=>n<100);if(!white(pixel(400,300)))throw Error('Brush area was not erased during the active gesture');if(!dark(pixel(200,300))||!dark(pixel(600,300)))throw Error('Untouched ink was modified');if(item.erasures)throw Error('Source model was mutated');
engine.stopPainting();ctx.strokeStyle='#ef3340';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(400,300);ctx.lineTo(460,300);ctx.stroke();engine.add(gesture,{x:430,y:300});engine.paint(ctx,key.scope);if(pixel(430,300)[0]<200||pixel(430,300)[1]>90)throw Error('Delayed erasing removed later writing');
document.getElementById('result').textContent='PASS — brushed pixels erased during an active gesture; untouched pixels and source model preserved; later writing remains visible. No completion, save or network call was used.';
}catch(error){document.getElementById('result').textContent='FAIL — '+error.message;}};
</script></html>
