<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="referrer" content="no-referrer"/>
<meta name="robots" content="noindex"/>
<title>WiNDS Notes · Signing in</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#f8f9fc;color:#5b5f7a;font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  @media(prefers-color-scheme:dark){body{background:#15161f;color:#b9bcd3}}
</style>
</head>
<body>
<p>Reconnecting Google Drive…</p>
<script>
/* Google OAuth return page. Hands the token response to the app without
 * loading it: to the parent window for a hidden-iframe renewal, or to this
 * tab's sessionStorage before returning to the notebook. Removes the token
 * from the address bar and history immediately. */
(function(){
  'use strict';
  var RESULT_KEY='winds-oauth-result-v1',PENDING_KEY='winds-oauth-pending-v1';
  var raw=location.hash.length>1?location.hash.slice(1):location.search.slice(1);
  var params=new URLSearchParams(raw);
  function field(name,max){return String(params.get(name)||'').slice(0,max);}
  var payload={type:'winds-oauth',state:field('state',128),access_token:field('access_token',4096),
    expires_in:field('expires_in',12),scope:field('scope',1024),error:field('error',64)};
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  if(window.parent&&window.parent!==window){
    try{window.parent.postMessage(payload,location.origin);}catch(e){}
    return;
  }
  var text=JSON.stringify(payload);
  var stored=false;
  try{sessionStorage.setItem(RESULT_KEY,text);stored=sessionStorage.getItem(RESULT_KEY)===text;}catch(e){}
  if(!stored){try{localStorage.setItem(RESULT_KEY,text);}catch(e){}}
  var target='./';
  try{
    var pending=JSON.parse(localStorage.getItem(PENDING_KEY)||'null');
    var back=pending&&typeof pending.returnTo==='string'?pending.returnTo:'';
    if(/^\/(?![\/\\])[^\\\s]*$/.test(back)&&back.length<2048)target=back;
  }catch(e){}
  location.replace(target);
})();
</script>
</body>
</html>
