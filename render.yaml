services:
  - type: web
    name: winds-notes-live
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: node --check server/start.mjs
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: winds-sessions
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: ">=22 <23"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WINDS_SESSION_KEY
        generateValue: true
      - key: WINDS_SESSION_FILE
        value: /var/data/sessions.enc
      - key: WINDS_LIVE_SYNC
        value: "true"
